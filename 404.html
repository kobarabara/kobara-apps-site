<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜Kobara Apps</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .not-found-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .not-found-card { width: 100%; max-width: 640px; padding: clamp(24px, 6vw, 48px); border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .not-found-brand { font-size: 22px; font-weight: 800; text-decoration: none; }
    .not-found-code { margin: 32px 0 0; color: var(--sub); font-size: 18px; font-weight: 700; }
    .not-found-card h1 { margin: 8px 0 16px; font-size: clamp(24px, 5vw, 32px); line-height: 1.5; overflow-wrap: anywhere; }
    .not-found-card p { color: var(--sub); }
    .not-found-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
  </style>
</head>
<body>
  <main class="not-found-wrap">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <a class="not-found-brand" href="/">Kobara Apps</a>
      <p class="not-found-code">404 — Not Found</p>
      <h1 id="not-found-title">ページが見つかりません</h1>
      <p>指定されたページは存在しないか、移動・削除された可能性があります。URLをご確認いただくか、トップページからお探しください。</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="/">トップページへ</a>
        <a class="btn btn-secondary" href="/contact.html">お問い合わせ</a>
      </div>
    </section>
  </main>
</body>
</html>
